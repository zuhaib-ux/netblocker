# Net Blocker - builds an Android APK from the code below.
# Upload this file to .github/workflows/ in your GitHub repository.
# Every time it changes, GitHub builds a new NetBlocker.apk and puts it under "Releases".

name: Build Net Blocker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_APPLOCK'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.myapps.netblocker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.myapps.netblocker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              // Fixed signing key, so future builds install as updates
              // (no need to uninstall and set up again).
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("netblocker.jks")
                      storePassword = "netblock123"
                      keyAlias = "netblocker"
                      keyPassword = "netblock123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF_APPLOCK
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_APPLOCK'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_APPLOCK
          mkdir -p "$(dirname 'app/src/main/java/com/myapps/netblocker/BlockerService.kt')"
          cat > 'app/src/main/java/com/myapps/netblocker/BlockerService.kt' <<'EOF_APPLOCK'
          package com.myapps.netblocker

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.net.VpnService
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream

          /**
           * A local "VPN" that never leaves the phone. Only the blocked apps are sent
           * into it, and everything they send is thrown away, so they have no internet.
           * All other apps don't touch it and work normally.
           */
          class BlockerService : VpnService() {

              companion object {
                  const val ACTION_START = "com.myapps.netblocker.START"
                  const val ACTION_STOP = "com.myapps.netblocker.STOP"
                  const val ACTION_RELOAD = "com.myapps.netblocker.RELOAD"

                  @Volatile
                  var running = false
              }

              @Volatile
              private var iface: ParcelFileDescriptor? = null
              private val handler = Handler(Looper.getMainLooper())
              private var callback: ConnectivityManager.NetworkCallback? = null
              private val wifiNetworks = HashMap<Network, Boolean>()
              private var onWifi: Boolean? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      shutdown()
                      return START_NOT_STICKY
                  }
                  // START, RELOAD, or started by Android's "Always-on VPN" setting.
                  if (callback == null) watchNetworks()
                  rebuild()
                  return START_STICKY
              }

              override fun onRevoke() {
                  // The user turned the VPN off in Settings, or another VPN app took over.
                  shutdown()
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }

              /** Follows WiFi on/off so the right block list is used. */
              private fun watchNetworks() {
                  val cm = getSystemService(ConnectivityManager::class.java)
                  val cb = object : ConnectivityManager.NetworkCallback() {
                      override fun onCapabilitiesChanged(network: Network, caps: NetworkCapabilities) {
                          wifiNetworks[network] = caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) &&
                              caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
                          checkNetwork()
                      }

                      override fun onLost(network: Network) {
                          wifiNetworks.remove(network)
                          checkNetwork()
                      }
                  }
                  val request = NetworkRequest.Builder()
                      .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      .addCapability(NetworkCapabilities.NET_CAPABILITY_NOT_VPN)
                      .build()
                  cm.registerNetworkCallback(request, cb, handler)
                  callback = cb
              }

              private fun checkNetwork() {
                  val wifi = wifiNetworks.values.any { it }
                  if (wifi != onWifi) {
                      onWifi = wifi
                      rebuild()
                  }
              }

              @Suppress("DEPRECATION")
              private fun currentlyOnWifi(): Boolean {
                  val cm = getSystemService(ConnectivityManager::class.java)
                  return cm.allNetworks.any { n ->
                      val caps = cm.getNetworkCapabilities(n) ?: return@any false
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) &&
                          !caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN) &&
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
                  }
              }

              private fun rebuild() {
                  val wifi = onWifi ?: currentlyOnWifi().also { onWifi = it }
                  val blocked = Prefs.blocked(this, wifi)

                  val builder = Builder()
                      .setSession(if (wifi) "Blocking on WiFi" else "Blocking on mobile data")
                      .setMtu(1500)
                      .addAddress("10.111.222.1", 32)
                      .addAddress("fd00:1:fd00:1:fd00:1:fd00:1", 128)
                      .addRoute("0.0.0.0", 0)
                      .addRoute("::", 0)

                  // This app itself is always in the list. That keeps the list from ever
                  // being empty, because an empty list would block EVERY app.
                  builder.addAllowedApplication(packageName)
                  for (p in blocked) {
                      try {
                          builder.addAllowedApplication(p)
                      } catch (e: PackageManager.NameNotFoundException) {
                          // App was uninstalled - skip it.
                      }
                  }

                  val newIface = try {
                      builder.establish()
                  } catch (e: Exception) {
                      null
                  }
                  val old = iface
                  iface = newIface
                  try {
                      old?.close()
                  } catch (e: Exception) {
                  }
                  running = newIface != null
                  if (newIface != null) drain(newIface)
              }

              /** Reads and throws away everything the blocked apps try to send. */
              private fun drain(pfd: ParcelFileDescriptor) {
                  val t = Thread {
                      val input = FileInputStream(pfd.fileDescriptor)
                      val buf = ByteArray(32767)
                      while (iface === pfd) {
                          val n = try {
                              input.read(buf)
                          } catch (e: Exception) {
                              0
                          }
                          if (n <= 0) {
                              try {
                                  Thread.sleep(100)
                              } catch (e: InterruptedException) {
                                  break
                              }
                          }
                      }
                  }
                  t.isDaemon = true
                  t.start()
              }

              private fun cleanup() {
                  callback?.let {
                      try {
                          getSystemService(ConnectivityManager::class.java).unregisterNetworkCallback(it)
                      } catch (e: Exception) {
                      }
                  }
                  callback = null
                  val old = iface
                  iface = null
                  try {
                      old?.close()
                  } catch (e: Exception) {
                  }
                  running = false
              }

              private fun shutdown() {
                  cleanup()
                  stopSelf()
              }
          }
          EOF_APPLOCK
          mkdir -p "$(dirname 'app/src/main/java/com/myapps/netblocker/MainActivity.kt')"
          cat > 'app/src/main/java/com/myapps/netblocker/MainActivity.kt' <<'EOF_APPLOCK'
          package com.myapps.netblocker

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.net.VpnService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              companion object {
                  private const val REQ_VPN = 1
              }

              data class AppItem(val pkg: String, val label: String)

              private var allApps: List<AppItem> = emptyList()
              private var shown: List<AppItem> = emptyList()
              private var query = ""
              private lateinit var status: TextView
              private lateinit var toggle: Button
              private val adapter = AppAdapter()
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.addView(buildHeader())
                  val list = ListView(this)
                  list.adapter = adapter
                  root.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)
                  loadApps()
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val on = BlockerService.running
                  status.text = if (on) "🛡️ Blocker is ON" else "Blocker is OFF"
                  toggle.text = if (on) "Stop blocker" else "Start blocker"
              }

              private fun buildHeader(): View {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(16), dp(12), dp(16), dp(4))

                  status = TextView(this)
                  status.textSize = 18f
                  box.addView(status)

                  toggle = Button(this)
                  toggle.isAllCaps = false
                  toggle.setOnClickListener { onToggle() }
                  box.addView(toggle)

                  val help = TextView(this)
                  help.text = "Tick WiFi to block an app on WiFi. Tick Data to block it on mobile data."
                  help.setPadding(0, dp(8), 0, dp(4))
                  box.addView(help)

                  val search = EditText(this)
                  search.hint = "Search apps"
                  search.isSingleLine = true
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          query = s?.toString().orEmpty()
                          applyFilter()
                      }
                  })
                  box.addView(search, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  return box
              }

              private fun onToggle() {
                  if (BlockerService.running) {
                      startService(Intent(this, BlockerService::class.java).setAction(BlockerService.ACTION_STOP))
                      handler.postDelayed({ refresh() }, 600)
                      return
                  }
                  val consent = VpnService.prepare(this)
                  if (consent != null) {
                      @Suppress("DEPRECATION")
                      startActivityForResult(consent, REQ_VPN)
                  } else {
                      startBlocker()
                  }
              }

              @Deprecated("Simple result handling")
              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_VPN && resultCode == RESULT_OK) startBlocker()
              }

              private fun startBlocker() {
                  startService(Intent(this, BlockerService::class.java).setAction(BlockerService.ACTION_START))
                  handler.postDelayed({ refresh() }, 600)
              }

              private fun setBlocked(pkg: String, wifi: Boolean, block: Boolean) {
                  Prefs.setBlocked(this, wifi, pkg, block)
                  if (BlockerService.running) {
                      startService(Intent(this, BlockerService::class.java).setAction(BlockerService.ACTION_RELOAD))
                  }
              }

              private fun applyFilter() {
                  val q = query.trim()
                  shown = if (q.isEmpty()) allApps else allApps.filter { it.label.contains(q, ignoreCase = true) }
                  adapter.notifyDataSetChanged()
              }

              private fun loadApps() {
                  Thread {
                      val pm = packageManager
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val result = pm.queryIntentActivities(intent, 0)
                          .map { AppItem(it.activityInfo.packageName, it.loadLabel(pm).toString()) }
                          .filter { it.pkg != packageName }
                          .distinctBy { it.pkg }
                          .sortedBy { it.label.lowercase() }
                      runOnUiThread {
                          allApps = result
                          applyFilter()
                      }
                  }.start()
              }

              inner class AppAdapter : BaseAdapter() {
                  private val icons = HashMap<String, Drawable>()

                  override fun getCount(): Int = shown.size
                  override fun getItem(position: Int): Any = shown[position]
                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val row = convertView as? LinearLayout ?: makeRow()
                      val item = shown[position]
                      val iv = row.getChildAt(0) as ImageView
                      val tv = row.getChildAt(1) as TextView
                      val wifiBox = row.getChildAt(2) as CheckBox
                      val dataBox = row.getChildAt(3) as CheckBox
                      iv.setImageDrawable(icons.getOrPut(item.pkg) {
                          try {
                              packageManager.getApplicationIcon(item.pkg)
                          } catch (e: Exception) {
                              ColorDrawable(Color.TRANSPARENT)
                          }
                      })
                      tv.text = item.label
                      val c = this@MainActivity
                      wifiBox.setOnCheckedChangeListener(null)
                      dataBox.setOnCheckedChangeListener(null)
                      wifiBox.isChecked = item.pkg in Prefs.blocked(c, true)
                      dataBox.isChecked = item.pkg in Prefs.blocked(c, false)
                      wifiBox.setOnCheckedChangeListener { _, checked -> setBlocked(item.pkg, true, checked) }
                      dataBox.setOnCheckedChangeListener { _, checked -> setBlocked(item.pkg, false, checked) }
                      return row
                  }

                  private fun makeRow(): LinearLayout {
                      val c = this@MainActivity
                      val row = LinearLayout(c)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setPadding(c.dp(16), c.dp(6), c.dp(8), c.dp(6))
                      row.addView(ImageView(c), LinearLayout.LayoutParams(c.dp(36), c.dp(36)))
                      val tv = TextView(c)
                      tv.textSize = 15f
                      tv.setPadding(c.dp(12), 0, 0, 0)
                      row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      val wifiBox = CheckBox(c)
                      wifiBox.text = "WiFi"
                      row.addView(wifiBox)
                      val dataBox = CheckBox(c)
                      dataBox.text = "Data"
                      row.addView(dataBox)
                      return row
                  }
              }
          }
          EOF_APPLOCK
          mkdir -p "$(dirname 'app/src/main/java/com/myapps/netblocker/Prefs.kt')"
          cat > 'app/src/main/java/com/myapps/netblocker/Prefs.kt' <<'EOF_APPLOCK'
          package com.myapps.netblocker

          import android.content.Context

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          /** Which apps are blocked on WiFi and which on mobile data. */
          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("netblocker", Context.MODE_PRIVATE)
              private fun key(wifi: Boolean) = if (wifi) "blocked_wifi" else "blocked_data"

              fun blocked(c: Context, wifi: Boolean): Set<String> =
                  sp(c).getStringSet(key(wifi), null)?.toSet() ?: emptySet()

              fun setBlocked(c: Context, wifi: Boolean, pkg: String, block: Boolean) {
                  val s = blocked(c, wifi).toMutableSet()
                  if (block) s.add(pkg) else s.remove(pkg)
                  sp(c).edit().putStringSet(key(wifi), s).apply()
              }
          }
          EOF_APPLOCK
